<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumyra — Breast Health Companion (Stitch Frontend)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#9E3E4E",
            "primary-action": "#F2808F",
            secondary: "#7B5459",
            "soft-powder": "#F9E9EF",
            "warm-sand": "#E8D6D0",
            espresso: "#21191E",
          },
          fontFamily: {
            cairo: ["Cairo", "sans-serif"],
            jakarta: ["Plus Jakarta Sans", "sans-serif"],
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
      background: #F9E9EF;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .device-frame {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 12px 40px rgba(85, 66, 67, 0.15);
    }
  </style>
</head>
<body class="flex flex-col h-screen text-espresso">

  <!-- Top Global Inspection & Navigation Bar -->
  <header class="h-16 bg-white/95 backdrop-blur-md border-b border-warm-sand/80 px-4 md:px-6 flex items-center justify-between shrink-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-[#F2808F]/20 flex items-center justify-center text-primary font-bold">
        🌸
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-lg text-primary leading-none">لوميرا Lumyra</span>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-primary/10 text-primary font-semibold">Stitch UI</span>
        </div>
        <span class="text-xs text-secondary/80">Cross-Platform Breast Health Companion</span>
      </div>
    </div>

    <!-- Center: Screen Selector & Mode -->
    <div class="flex items-center gap-3">
      <!-- Screen Quick Switcher Dropdown -->
      <div class="relative">
        <select id="screen-selector" class="bg-[#FFF8F9] border border-primary/30 text-primary font-bold text-xs md:text-sm rounded-full px-4 py-2 pr-8 outline-none cursor-pointer hover:border-primary shadow-sm transition-all">
          <optgroup label="البداية والمصادقة (Onboarding & Auth)">
            <option value="screen_1_welcome_splash/code.html" selected>١. الترحيب (Welcome & Splash)</option>
            <option value="screen_2_role_selection/code.html">٢. اختيار الدور (Role Selection)</option>
            <option value="screen_3_sign_in_quick_switcher/code.html">٣. تسجيل الدخول والمحول السريع (Sign In)</option>
          </optgroup>
          <optgroup label="مسار المريضة (Patient Experience)">
            <option value="screen_4_patient_home_dashboard/code.html">٤. الرئيسية للمريضة (Patient Dashboard)</option>
            <option value="screen_5_guided_breast_health_questionnaire/code.html">٥. الاستبيان الإرشادي الموجه (Questionnaire)</option>
            <option value="screen_6_private_health_mood_journal/code.html">٦. سجل اليوميات والأعراض (Journal)</option>
            <option value="screen_7_medication_adherence_schedule_tracker/code.html">٧. جدول الأدوية والجرعات (Medications)</option>
            <option value="screen_8_appointments_consultation_booking/code.html">٨. حجز وإدارة المواعيد (Appointments)</option>
            <option value="screen_9_educational_library_breast_health_articles/code.html">٩. مكتبة التوعية والمقالات (Education)</option>
            <option value="screen_10_verified_medical_center_directory/code.html">١٠. دليل المراكز المعتمدة بمصر (Centers)</option>
            <option value="screen_11_conversational_ai_health_assistant/code.html">١١. المساعد الصحي الذكي (AI Assistant)</option>
          </optgroup>
          <optgroup label="مسار الطبيب (Doctor Experience)">
            <option value="screen_12_doctor_workspace_dashboard/code.html">١٢. لوحة عمل الطبيب (Doctor Workspace)</option>
            <option value="screen_13_patient_clinical_chart_overview/code.html">١٣. الملف السريري للمريضة (Patient Chart)</option>
            <option value="screen_14_secondary_medical_imaging_viewer/code.html">١٤. عارض الأشعة DICOM (Imaging Viewer)</option>
          </optgroup>
          <optgroup label="مسار الإدارة (Admin Experience)">
            <option value="screen_15_admin_governance_dashboard/code.html">١٥. لوحة التحكم العامة (Admin Governance)</option>
            <option value="screen_16_admin_doctor_license_verification_pipeline/code.html">١٦. اعتماد تراخيص الأطباء (Doctor Approvals)</option>
            <option value="screen_17_admin_security_hipaa_gdpr_audit_logs/code.html">١٧. سجلات الأمان والتدقيق (Audit Logs)</option>
          </optgroup>
        </select>
      </div>

      <!-- Device Viewport Toggle -->
      <div class="hidden sm:flex items-center bg-[#FFF8F9] border border-warm-sand rounded-full p-1 gap-1">
        <button id="btn-mobile" class="px-3 py-1 rounded-full text-xs font-semibold bg-primary text-white transition-all" onclick="setDevice('mobile')">
          📱 جوال (390px)
        </button>
        <button id="btn-tablet" class="px-3 py-1 rounded-full text-xs font-semibold text-secondary hover:text-primary transition-all" onclick="setDevice('tablet')">
          📱 تابلت (768px)
        </button>
        <button id="btn-full" class="px-3 py-1 rounded-full text-xs font-semibold text-secondary hover:text-primary transition-all" onclick="setDevice('full')">
          💻 كامل الشاشة
        </button>
      </div>
    </div>

    <!-- Right Controls: Landing Page, Auto-fill Demo, Backend Status & Standalone -->
    <div class="flex items-center gap-2">
      <a href="landing.html" class="px-3 py-1 rounded-full bg-primary/10 hover:bg-primary/20 text-primary font-bold text-xs flex items-center gap-1 transition-colors shadow-xs" title="زيارة الصفحة التعريفية للمبادرة">
        <span>🌸 صفحة لوميرا</span>
      </a>
      <button onclick="triggerDemoAutofill(this)" class="px-3 py-1 rounded-full bg-[#FFF8F9] hover:bg-white text-secondary hover:text-primary border border-warm-sand font-bold text-xs flex items-center gap-1 transition-colors shadow-xs" title="ملء وتجهيز بيانات العرض بضغطة واحدة">
        <span>⚡ تجهيز سيناريو العرض</span>
      </button>
      <div id="backend-status" class="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 text-xs font-semibold border border-emerald-200">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="backend-status-text">الباك إند: متصل</span>
      </div>
      <button onclick="openStandalone()" class="p-2 rounded-full text-secondary hover:text-primary hover:bg-white transition-colors" title="فتح الشاشة الحالية في نافذة منفصلة">
        <span class="material-symbols-outlined text-[20px]">open_in_new</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport Canvas -->
  <main class="flex-grow flex items-center justify-center p-2 sm:p-4 bg-[#F9E9EF] overflow-hidden relative">
    <div id="frame-container" class="device-frame w-[390px] h-[calc(100vh-84px)] rounded-[32px] overflow-hidden border-[6px] border-[#21191E] bg-white relative">
      <iframe id="screen-frame" src="screen_1_welcome_splash/code.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    const frame = document.getElementById('screen-frame');
    const container = document.getElementById('frame-container');
    const selector = document.getElementById('screen-selector');

    selector.addEventListener('change', (e) => {
      frame.src = e.target.value;
    });

    // Listen to child iframe navigation
    frame.addEventListener('load', () => {
      try {
        const currentPath = frame.contentWindow.location.pathname;
        for (let i = 0; i < selector.options.length; i++) {
          const optVal = selector.options[i].value;
          const folder = optVal.split('/')[0];
          if (currentPath.includes(folder)) {
            selector.selectedIndex = i;
            break;
          }
        }
      } catch (err) {
        // Cross-origin fallback
      }
    });

    function setDevice(mode) {
      document.getElementById('btn-mobile').className = 'px-3 py-1 rounded-full text-xs font-semibold ' + (mode === 'mobile' ? 'bg-primary text-white' : 'text-secondary hover:text-primary');
      document.getElementById('btn-tablet').className = 'px-3 py-1 rounded-full text-xs font-semibold ' + (mode === 'tablet' ? 'bg-primary text-white' : 'text-secondary hover:text-primary');
      document.getElementById('btn-full').className = 'px-3 py-1 rounded-full text-xs font-semibold ' + (mode === 'full' ? 'bg-primary text-white' : 'text-secondary hover:text-primary');

      if (mode === 'mobile') {
        container.style.width = '390px';
        container.style.maxWidth = '390px';
        container.style.borderRadius = '36px';
        container.style.borderWidth = '8px';
      } else if (mode === 'tablet') {
        container.style.width = '768px';
        container.style.maxWidth = '768px';
        container.style.borderRadius = '24px';
        container.style.borderWidth = '6px';
      } else {
        container.style.width = '100%';
        container.style.maxWidth = '100%';
        container.style.borderRadius = '0px';
        container.style.borderWidth = '0px';
      }
    }

    function triggerDemoAutofill(btn) {
      localStorage.setItem('lumyra_intake_done', 'true');
      localStorage.setItem('lumyra_doctor_approved', 'true');
      const orig = btn.innerHTML;
      btn.innerHTML = '<span>✓ تم تجهيز البيانات بنجاح</span>';
      btn.classList.add('bg-emerald-100', 'text-emerald-800');
      // Reload iframe with refreshed state
      frame.contentWindow.location.reload();
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('bg-emerald-100', 'text-emerald-800');
      }, 2500);
    }

    // Read initial mode and screen from URL
    const urlParams = new URLSearchParams(window.location.search);
    const initialMode = urlParams.get('mode');
    if (initialMode) setDevice(initialMode);
    const initialScreen = urlParams.get('screen');
    if (initialScreen) {
      frame.src = initialScreen;
    }

    function openStandalone() {
      window.open(frame.src, '_blank');
    }

    // Health Check Backend (http://localhost:4000/api/v1/health)
    fetch('http://localhost:4000/api/v1/health')
      .then(res => res.json())
      .then(data => {
        if (data.status === 'ok') {
          document.getElementById('backend-status-text').textContent = 'الباك إند: متصل 🟢';
        }
      })
      .catch(() => {
        const el = document.getElementById('backend-status');
        el.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 text-amber-800 text-xs font-semibold border border-amber-200';
        document.getElementById('backend-status-text').textContent = 'الباك إند: محلي (Dev Mode)';
      });
  </script>
</body>
</html>
