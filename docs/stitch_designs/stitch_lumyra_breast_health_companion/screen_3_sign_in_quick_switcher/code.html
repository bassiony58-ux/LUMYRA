<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!passwordInput || !eyeIcon) return;
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility_off';
    }
  }

  function quickRoleFill(role) {
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    
    if (!emailInput || !passwordInput) return;

    if (role === 'mariam') {
      emailInput.value = 'mock-mariam@lumyra.health';
      passwordInput.value = 'PatientSecurePass2025';
    } else if (role === 'doctor') {
      emailInput.value = 'dr.nour@lumyra.health';
      passwordInput.value = 'ClinicianAuthToken99';
    } else if (role === 'admin') {
      emailInput.value = 'admin@lumyra.health';
      passwordInput.value = 'LumyraMasterKeyRoot';
    }

    // Gentle micro-interaction: pulse CTA to guide user
    if (submitBtn) {
      submitBtn.classList.add('scale-105');
      setTimeout(() => submitBtn.classList.remove('scale-105'), 220);
    }
  }

  function handleStandardLogin() {
    const email = document.getElementById('emailInput')?.value;
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span> جارٍ التحقق...';
      setTimeout(() => {
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span> تم تسجيل الدخول بنجاح';
        setTimeout(() => {
          submitBtn.innerHTML = originalText;
        }, 1200);
      }, 700);
    }
  }
